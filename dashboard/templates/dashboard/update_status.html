<!DOCTYPE html>
<html>

<head>

    <title>Update Status</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

    <div class="container mt-5">

        <div class="card shadow p-4">

            <h2 class="mb-4">

                Update Status for

                <span class="text-primary">
                    {{ case.case_code }}
                </span>

            </h2>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Choose Status
                    </label>

                    <select
                        name="status"
                        id="status"
                        class="form-select"
                    >

                        <option value="received"
                            {% if case.status == "received" %}
                                selected
                            {% endif %}
                        >
                            Received
                        </option>

                        <option value="investigation"
                            {% if case.status == "investigation" %}
                                selected
                            {% endif %}
                        >
                            Under Investigation
                        </option>

                        <option value="referral"
                            {% if case.status == "referral" %}
                                selected
                            {% endif %}
                        >
                            Referral
                        </option>

                        <option value="closed"
                            {% if case.status == "closed" %}
                                selected
                            {% endif %}
                        >
                            Closed
                        </option>
                        
                        <option value="declined"
    {% if case.status == "declined" %}
        selected
    {% endif %}
>
    Declined
</option>
                    </select>

                </div>

                <div
                    id="referral-box"
                    class="mb-3"
                    style="display: none;"
                >

                    <label class="form-label">

                        Referral Explanation

                    </label>

                    <textarea
                        name="referral_notes"
                        class="form-control"
                        rows="5"
                        placeholder="Explain where the case has been referred to and why..."
                    >{{ case.referral_notes }}</textarea>

                </div>
<div
    id="decline-box"
    class="mb-3"
    style="display: none;"
>

    <label class="form-label">
        Reason for Declining
    </label>

    <textarea
        name="decline_reason"
        class="form-control"
        rows="5"
        placeholder="Explain why this case was declined..."
    >{{ case.decline_reason }}</textarea>

</div>
                <div class="mb-3">

                    <label class="form-label">

                        Or Type Custom Status

                    </label>

                    <input
                        type="text"
                        name="custom_status"
                        class="form-control"
                        placeholder="Example: Referred to Police"
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                >

                    Save Status

                </button>

                <a
                    href="{% url 'cases' %}"
                    class="btn btn-secondary"
                >

                    Cancel

                </a>

            </form>

        </div>

    </div>

    <script>

        window.onload = function () {

            const statusSelect =
                document.getElementById(
                    "status"
                );

            const referralBox =
                document.getElementById(
                    "referral-box"
                );

            const declineBox =
    document.getElementById(
        "decline-box"
    );
    
           function toggleBoxes() {

    referralBox.style.display = "none";
    declineBox.style.display = "none";

    if (statusSelect.value === "referral") {

        referralBox.style.display = "block";

    }

    if (statusSelect.value === "declined") {

        declineBox.style.display = "block";

    }

}

           statusSelect.addEventListener(
    "change",
    toggleBoxes
);

toggleBoxes();

            toggleReferralBox();

        };

    </script>

</body>

</html>
