{% extends 'reports/base.html' %}

{% block content %}
<h2>Submit Anonymous Report</h2>

<form method="POST">
    {% csrf_token %}
    <div class="mb-3">
        {{ form.title.label }}
        {{ form.title }}
    </div>

    <div class="mb-3">
        {{ form.message.label }}
        {{ form.message }}
    </div>

    <button class="btn btn-primary">Submit</button>
</form>
{% endblock %}
